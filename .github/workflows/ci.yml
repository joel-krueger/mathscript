name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mathscript
          POSTGRES_PASSWORD: mathscript
          POSTGRES_DB: mathscript
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathscript -d mathscript"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mathscript:mathscript@localhost:5432/mathscript
      TEST_DATABASE_URL: postgresql://mathscript:mathscript@localhost:5432/mathscript_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Service containers cannot mount init scripts, so create the test DB here
      # (mirrors docker/postgres/init/01-create-test-db.sql).
      - name: Create test database
        env:
          PGPASSWORD: mathscript
        run: createdb -h localhost -p 5432 -U mathscript mathscript_test

      - name: Generate Prisma client
        run: pnpm --filter @mathscript/api --if-present db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm -r --if-present build
