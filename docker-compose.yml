services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mathscript
      POSTGRES_PASSWORD: mathscript
      POSTGRES_DB: mathscript
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathscript -d mathscript"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
